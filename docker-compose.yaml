services:
  db:
    image: postgres:16
    container_name: peluqueria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peluqueria
      POSTGRES_PASSWORD: dev_local_2024
      POSTGRES_DB: peluqueria
    ports:
      - "5432:5432"
    volumes:
      - peluqueria_pgdata:/var/lib/postgresql/data

volumes:
  peluqueria_pgdata: