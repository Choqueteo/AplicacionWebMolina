services:
  # ── Backend (FastAPI + uvicorn) ──────────────────────────────────────────────
  - type: web
    name: rm-backend
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # ── Dominio propio (descomentar cuando rmolinastyle.com esté verificado en Render) ──
    # domains:
    #   - api.rmolinastyle.com
    envVars:
      # ── No secretas: declaradas aquí (van al repo) ───────────────────────────
      - key: ENVIRONMENT
        value: production
      # FASE ONRENDER → dominio propio: cambiar a '["https://rmolinastyle.com","https://www.rmolinastyle.com"]'
      - key: ALLOWED_ORIGINS
        value: '["https://rm-frontend-4wr6.onrender.com"]'
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: RETENCION_MESES
        value: "24"
      # ── Inyectada por Render desde la BD gestionada ──────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: rm-postgres
          property: connectionString
      # ── Generada por Render en el primer deploy (nunca en el repo) ───────────
      - key: SECRET_KEY
        generateValue: true
      # ── Secretas: introducir a mano en el panel de Render ───────────────────
      - key: ADMIN1_EMAIL
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN1_NOMBRE
        sync: false
      - key: ADMIN1_TELEFONO
        sync: false
      - key: ADMIN2_EMAIL
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false
      - key: ADMIN2_NOMBRE
        sync: false
      - key: ADMIN2_TELEFONO
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # ── Frontend (React + Vite → static site) ────────────────────────────────────
  - type: web
    name: rm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # ── Dominio propio (descomentar cuando rmolinastyle.com esté verificado en Render) ──
    # domains:
    #   - rmolinastyle.com
    #   - www.rmolinastyle.com
    routes:
      # SPA: cualquier ruta que no sea un archivo estático devuelve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # FASE ONRENDER → dominio propio: cambiar a https://api.rmolinastyle.com
      - key: VITE_API_URL
        value: https://rm-backend-z7zb.onrender.com

databases:
  - name: rm-postgres
    databaseName: peluqueria
    region: frankfurt
    plan: basic-256mb   # plan de PostgreSQL; "starter" es para web services, no para BD
    ipAllowList: []     # solo conexiones internas de Render; bloquea acceso externo
